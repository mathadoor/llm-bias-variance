# Run 1: simplest task to get signal on the pipeline and the hypothesis
dataset: 
    name: ajaykarthick/imdb-movie-reviews   # for sentiment analysis
    train_split: 0.999
model:
    name: Qwen/Qwen3-0.6B
    device: cuda
    tokenizer:
        padding_side: left
metric: accuracy
prompting: zero_shot
chat_template: True
generation:
    temperature: 0.0
    max_new_tokens: 1000
    do_sample: False
    num_beams: 1
    store_probs: True
    labels: ["0", "1"]
train:
    num_samples: [1, 3, 5, 10, 20, 50]
    num_runs_per_size: 3
validation:
    batch_size: 32
    num_traces: 100   # per correct / incorrect group
mlflow:
  tracking_uri: null   # taken from the MLFLOW_TRACKING_URI env var
  experiment: llm-bias-variance-2
  run_name: run1-sentiment
seed: 0
